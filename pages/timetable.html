<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Timetable | Chronova</title>

<link rel="stylesheet" href="../css/style.css">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container py-5">

<h1 class="text-center mb-4">⏱ Smart Timetable Generator</h1>

<p class="text-center">
Enter your tasks and Chronova will help organize your day.
</p>

<div class="row justify-content-center">

<div class="col-md-6">

<input type="text" id="taskInput" class="form-control mb-3" placeholder="Enter a task">

<button class="btn btn-primary w-100 mb-3" onclick="addTask()">
Add Task
</button>

<ul id="taskList" class="list-group"></ul>

</div>

</div>

</div>

<script src="../js/script.js"></script>

</body>
</html>
